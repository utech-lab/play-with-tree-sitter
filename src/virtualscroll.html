<!doctype html>
<html translate="no">
<head>
	<meta charset="utf-8" />
	<meta name="google" content="notranslate" />
	<title>code viewer</title>
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
	<meta http-equiv="Pragma" content="no-cache">
	<meta http-equiv="Expires" content="0">
	<link rel="icon" href="data:,">
	<style>
		body {
			margin: 0;
			font-family: monospace;
			color: white;
			overflow: hidden;
			font-size: 16px;
			padding: 0;
			height: 100%;
		}



		#topSpacer, #bottomSpacer {
			width: 100%;
		}

		#visible {
			margin: 0;
			padding: 0;
		}

		.ts-ln {
			background-color: #2a2a2a;
			width: 3em;
			text-align: right;
			padding-right: 8px;
			font-family: monospace;
			user-select: none;
			flex-shrink: 0;
		}
		/*
			 .ts-cl {
				 display: flex;
				 flex-direction: row;
				 align-items: flex-start;
				 white-space: pre;
				 font-family: monospace;
			 }*/
		.ts-cl {
			display: flex;
			height: 20px;
			line-height: 20px;
			overflow: hidden;
			box-sizing: border-box;
			flex-shrink: 0;
		}

			.ts-cl.line-select {
				background-color: rgba(0, 120, 215, 0.2); /* 綺麗で邪魔にならない青系など */
			}
			/* コピー成功時に行全体をピカッとさせるクラス */
			.ts-cl.copy-flash {
				animation: flashEffect 0.4s ease-out;
			}

		@keyframes flashEffect {
			0% {
				/* コピーした瞬間の色（例：白に近い明るい青） */
				background-color: rgba(140, 190, 255, 0.8);
			}

			100% {
				/* 最終的に通常の背景色（透明など）へ消えていく */
				background-color: rgba(0, 120, 215, 0.0);
			}
		}

		.ts-cl.jump-flash {
			animation: jumpFlashEffect 0.7s ease-out; /* 0.7秒かけてじわっと消える */
		}

		@keyframes jumpFlashEffect {
			0% {
				background-color: rgba(255, 230, 100, 0.7); /* 注目を引きやすい黄色 */
			}

			100% {
				background-color: rgba(255, 230, 100, 0.0);
			}
		}


		.ts-ln,
		.code-content {
			height: 20px;
			line-height: 20px;
			box-sizing: border-box;
			overflow: hidden;
			white-space: pre;
		}

		.ts-ju {
			background-color: #263d5a;
		}
		/* 基本の背景とフォント */

		.ts-code {
			background-color: #1e1e1e;
			color: #d4d4d4;
			font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
			line-height: 1.5;
			white-space: pre;
			tab-size: var(--tab-size, 4);
		}

		/* 言語共通のハイライトカラー */
		.ts-keyword {
			color: #569cd6;
			font-weight: bold;
		}
		/* if, return, class */
		.ts-control {
			color: #c586c0;
		}
		/* 制御系キーワードを分ける場合 */
		.ts-string {
			color: #ce9178;
		}
		/* "hello" */
		.ts-number {
			color: #b5cea8;
		}
		/* 123 */
		.ts-comment {
			color: #6a9955;
			font-style: italic;
		}
		/* // comment */
		.ts-type {
			color: #4ec9b0;
		}
		/* string, int, MyClass */
		.ts-function {
			color: #dcdcaa;
		}
		/* method_name */
		.ts-function-method {
			color: #dcdcaa;
		}
		/* C#などのメソッド */
		.ts-variable {
			color: #9cdcfe;
		}
		/* ローカル変数
			 .ts-property {
				 color: #9cdcfe;
			 }*/
		/* プロパティ */
		.ts-parameter {
			color: #9cdcfe;
		}
		/* 引数 */
		.ts-operator {
			color: #d4d4d4;
		}
		/* +, -, = */
		/*.ts-punctuation-bracket {
				 color: #ffd700;
			 }*/
		/* { } ( ) */
		.ts-punctuation-delimiter {
			color: #d4d4d4;
		}
		/* , ; */
		.ts-label {
			color: #c586c0;
		}
		/* case:, goto: */
		.ts-type-builtin {
			color: #569CD6;
		}

		.ts-variable-parameter {
			color: #9CDCFE;
		}

		.ts-tag {
			color: #569CD6;
		}

		.ts-attribute {
			color: #9CDCFE;
		}

		.ts-string-escape {
			color: #FFD68F;
		}

		.ts-function-call {
			color: #DCDCAA;
		}


		/* 🔍 */
		#searchContainer, #settingContainer, #definitionContainer, #bookMarkContainer {
			position: fixed;
			z-index: 1000;
		}

		#searchContainer {
			top: 30px;
			right: 50px;
		}

		#settingContainer {
			top: 30px;
			right: 100px;
		}

		#definitionContainer {
			top: 30px;
			right: 150px;
		}

		#bookMarkContainer {
			top: 30px;
			right: 200px;
		}




		#searchButton, #settingButton, #definitionButton, #bookMarkButton {
			font-size: 22px;
			cursor: move;
		}

		#searchPanel, #settingPanel, #definitionPanel, #bookMarkPanel {
			resize: both; /* 横・縦両方 */
			overflow: hidden; /* 必須 */
			position: absolute;
			top: 40px;
			right: 10px;
			width: 260px;
			height: 500px; /* ← 高さが必要 */
			display: none;
			flex-direction: column;
			background: rgba(0,0,0,0.7);
			color: white;
			padding: 10px;
			border-radius: 6px;
			z-index: 1000;
		}

			#searchPanel.show, #settingPanel.show, #definitionPanel.show, #bookMarkPanel.show {
				display: flex; /* showクラスがついたら表示 */
			}


		/* textbox */
		#searchBox, #definitionSearchBox, #definitionReferSearchBox {
			width: 100%;
			padding: 6px;
			box-sizing: border-box;

		}

		#searchRegexLabel, #searchResultLabel, #definitionRegexLabel, #definitionSearchResultLabel, #definitionReferRegexLabel, #definitionReferSearchResultLabel {
			padding: 6px;
			box-sizing: border-box;
		}
		/* ナビ */
		.searchNav {
			margin-top: 5px;
			display: flex;
			gap: 5px;
		}

			.searchNav button {
				flex: 1;
			}


		.search-header {
			flex: 0 0 auto;
			display: flex;
			flex-direction: column;
			gap: 6px;
		}
		/* ヒット表示 */
		#searchInfo {
			font-size: 12px;
			text-align: center;
			margin-top: 4px;
		}
		.search-spinner {
			display: inline-block;
			width: 16px;
			height: 16px;
			border: 3px solid #f3f3f3;
			border-top: 3px solid #3498db;
			border-radius: 50%;
			animation: search-spin 0.8s linear infinite;
			vertical-align: -5px;
			box-sizing: border-box;
		}
		/* 0度から360度までクルクル回すアニメーション */
		@keyframes search-spin {
			0% {
				transform: rotate(0deg);
			}
			100% {
				transform: rotate(360deg);
			}
		}

		#bookMarkHeader {
			display: flex;
			padding: 6px;
			border-bottom: 1px solid rgba(255, 255, 255, 0.1);
		}

		#bookMarkList {
			flex: 1;
			overflow-y: auto;
			overflow-x: hidden;
			margin-top: 10px;
			padding-right: 4px;
			min-height: 0; /* ←これ重要 */
		}

		.bookmark-item {
			padding: 6px 8px;
			margin: 2px 0;
			border-radius: 3px;
			cursor: pointer;
			/* 長い選択文字列対策 */
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

			.bookmark-item:hover {
				background: rgba(255, 255, 255, 0.1);
			}

			.bookmark-item.selected {
				background: rgba(255, 255, 255, 0.2);
			}



		#scroll {
			background-color: #1e1e1e;

			height: calc(100vh - 16px);
			position: relative;
			overflow-y: scroll;
		}
		/* 通常の検索ヒット：枠線を無くし、少しだけ透明度を上げて文字を際立たせる */
		.search-hit {
			background-color: rgba(234, 195, 34, 0.25); /* 渋い金/黄色 */
			color: inherit;
			border-radius: 0; /* 途中で切れたタグ同士が綺麗に繋がるように角丸を0にします */
		}

			/* いま選択されている検索ヒット：枠線を無くす代わりに、背景の不透明度を上げて「光っている感」を出す */
			.search-hit.current-active {
				background-color: rgba(247, 125, 32, 0.65) !important; /* 濃いオレンジ */
				color: #ffffff !important; /* 文字を白にして視認性を最優先 */
				outline: none !important; /* 外枠を完全に排除 */
				border: none !important;
				border-radius: 0; /* つなぎ目がフラットに一体化します */
			}

		/* ==========================================================================
		▼ 定義アウトライン（#definitionPanel 内）のスタイル
		========================================================================== */

		/* パネル内のリストコンテナ（これがないと、要素が多いときにパネルが画面外に突き抜けます） */
		.def-list {
			flex: 1;
			overflow-y: auto;
			overflow-x: hidden;
			margin-top: 10px;
			padding-right: 4px;
			min-height: 0; /* ←これ重要 */
		}

			/* スクロールバーの見た目をダークテーマに合わせる（任意） */
			.def-list::-webkit-scrollbar {
				width: 6px;
			}

			.def-list::-webkit-scrollbar-thumb {
				background: rgba(255, 255, 255, 0.2);
				border-radius: 3px;
			}

			/* ツリーアイテムとsummaryの共通スタイル */
			.def-list summary,
			.def-list .tree-item {
				display: block;
				padding: 4px 6px 4px 18px;
				border-radius: 4px;
				cursor: pointer;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				position: relative;
				line-height: 1.5;
				font-size: 16px; /* お好みのサイズに */
			}

				/* ホバー時の背景色 */
				.def-list summary:hover,
				.def-list .tree-item:hover {
					background-color: rgba(255, 255, 255, 0.15);
					color: #ffffff;
				}

			/* detailsのデフォルト矢印を消して、独自のインジケータ（▶）を配置 */
			.def-list details summary::-webkit-details-marker {
				display: none;
			}

			.def-list details summary {
				list-style: none;
				padding-left: 18px !important;
			}

			.def-list details > summary::before {
				content: "▶";
				position: absolute;
				left: 4px;
				top: 5px;
				font-size: 9px;
				color: #aaaaaa;
				transition: transform 0.1s ease;
			}

			.def-list details[open] > summary::before {
				transform: rotate(90deg);
			}

		/* 子要素（インデント）の線と余白 */
		.tree-children {
			margin-left: 8px;
			padding-left: 6px;
			border-left: 1px dashed rgba(255, 255, 255, 0.2); /* 白の半透明点線に */
		}


		/* ==========================================================================
		▼ アイコン（絵文字）と文字色の一括定義
		========================================================================== */
		/* ==========================================================================
		▼ アイコン（絵文字）と文字色の一括定義（修正版）
		========================================================================== */
		.def-list::before {
			display: inline-block;
			margin-right: 6px;
			font-size: 13px;
			vertical-align: middle;
		}

		/* 1. モジュール・コンテナ系 */
		:is(.definition-module, .definition-charset, .definition-layout) {
			color: #cccccc;
		}

			:is(.definition-module, .definition-charset, .definition-layout)::before {
				content: "📦";
			}

		/* 2. 型・クラス定義系 */
		:is(.definition-type, .definition-import, .definition-text) {
			color: #4ec9b0;
		}

			:is(.definition-type, .definition-import, .definition-text)::before {
				content: "🔹";
			}
		/* 階層に関係なく、definition-classの内側にある.nameすべてに適用 */
		:is(.definition-class, .definition-namespace, .definition-form) {
			color: #4ec9b0;
		}

			:is(.definition-class, .definition-namespace, .definition-form)::before {
				content: "🔷";
			}

		:is(.definition-interface, .definition-layer, .definition-link) {
			color: #b5cea8;
		}

			:is(.definition-interface, .definition-layer, .definition-link)::before {
				content: "🌐";
			}

		:is(.definition-struct, .definition-selector, .definition-table) {
			color: #86c1b9;
		}

			:is(.definition-struct, .definition-selector, .definition-table)::before {
				content: "🧱";
			}

		:is(.definition-alias, .definition-supports, .definition-script) {
			color: #4fc1ff;
		}

			:is(.definition-alias, .definition-supports, .definition-script)::before {
				content: "🏷️";
			}
		/* 3. 列挙型系 */
		:is(.definition-enum, .definition-media) {
			color: #c586c0;
		}

			:is(.definition-enum, .definition-media)::before {
				content: "📜";
			}

		:is(.definition-enum_member, .definition-starting-style, .definition-other) {
			color: #c586c0;
		}

			:is(.definition-enum_member, .definition-starting-style, .definition-other)::before {
				content: "🔸";
			}
		/* 4. 処理・関数・イベント系 */
		:is(.definition-delegate, .definition-container) {
			color: #ee9d28;
		}

			:is(.definition-delegate, .definition-container)::before {
				content: "⚙️";
			}

		:is(.definition-method, .definition-scope, .definition-style) {
			color: #dcdcaa;
		}

			:is(.definition-method, .definition-scope, .definition-style)::before {
				content: "⚡";
			}

		:is(.definition-event, .definition-keyframes) {
			color: #f44336;
		}

		:is(.definition-event, .definition-keyframes, .definition-eventlistener)::before {
			content: "🔔";
		}
		/* 5. データ・変数・プロパティ系 */
		:is(.definition-property, .definition-font-face, .definition-eventlistener) {
			color: #9cdcfe;
		}

		:is(.definition-property, .definition-font-face)::before {
			content: "📝";
		}

		:is(.definition-field, .definition-page) {
			color: #9cdcfe;
		}

			:is(.definition-field, .definition-page)::before {
				content: "🔹";
			}
		/* 6. 特殊マークアップ・Web要素系 */
		:is(.definition-element, .definition-counter-style, .definition-variable) {
			color: #ce9178;
		}

			:is(.definition-element, .definition-counter-style, .definition-variable)::before {
				content: "🏷️";
			}

		:is(.definition-section, .definition-function) {
			color: #608b4e;
			font-weight: bold;
		}

			:is(.definition-section, .definition-function)::before {
				content: "🔖";
			}

		:is(.definition-view-transition) {
			color: #708b4e;
			font-weight: bold;
		}

			:is(.definition-view-transition)::before {
				content: "☄";
			}


		:is(.call-method, .call-function) {
			color: #58A6FF;
			font-weight: bold;
		}

			:is(.call-method, .call-function)::before {
				content: "📞";
			}

		:is(.ref-symbol) {
			color: #2ECC71;
			font-weight: bold;
		}

			:is(.ref-symbol)::before {
				content: "🌿";
			}


		/* タブ全体のコンテナ */
		.definition-tabs {
			flex: 0 0 auto;
			border-bottom: 1px solid rgba(255, 255, 255, 0.1);
			margin-bottom: 8px;
		}
		/* タブのボタン */
		.def-tab-btn {
			flex: 1;
			background: none;
			border: none;
			color: #858585;
			padding: 6px 0;
			font-size: 16px;
			cursor: pointer;
			text-align: center;
			border-bottom: 2px solid transparent;
			transition: all 0.2s ease;
		}

			.def-tab-btn:hover {
				color: #ffffff;
			}
			/* アクティブな（選択中の）タブ */
			.def-tab-btn.active {
				color: #4fc1ff; /* 目立つライトブルーなど */
				border-bottom-2px-solid: #4fc1ff;
				font-weight: bold;
			}
		/* タブコンテンツの表示制御 */
		.def-tab-content {
			display: none;
			flex: 1;
			overflow: hidden;
			flex-direction: column;
		}

			.def-tab-content.active {
				display: flex;
			}
		/* 検索結果リスト用の高さ制限（ツリーと同様にスクロールさせる） */
		#definitionSearchResultList, #definitionReferResultList {
			overflow-y: auto;
			margin-top: 8px;
		}

		.symbol-item {
			padding: 6px 10px;
			cursor: pointer;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			border-bottom: 1px solid #eee;
		}

			.symbol-item:hover {
				background-color: rgba(255, 255, 255, 0.15);
				color: #ffffff;
			}

		.symbol-name {
			font-weight: bold;
			color: #333;
		}

		.file-name {
			margin: 0 0.4em;
			color: greenyellow;
			font-size: 0.75em;
		}

		.symbol-declaration {
			color: #DDD;
			font-size: 0.9em;
		}
		/* クラスやメソッドごとにアイコンや色を変えたい場合のフック */
		.symbol-item.definition-class .symbol-name {
			color: #2b579a;
		}

		.symbol-item.definition-method .symbol-name {
			color: #74519a;
		}

		.tcm-menu {
			display: none;
			position: absolute;
			z-index: 10000;
			width: 180px;
			background-color: #252526;
			color: #cccccc;
			border: 1px solid #454545;
			box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.4);
			border-radius: 4px;
			padding: 4px 0;
			font-family: sans-serif;
			font-size: 13px;
			user-select: none;
		}

		.tcm-menu-header {
			padding: 6px 12px;
			font-size: 11px;
			color: #888;
			border-bottom: 1px solid #333;
			margin-bottom: 4px;
		}

		.tcm-menu-item {
			padding: 6px 12px;
			cursor: pointer;
		}

			.tcm-menu-item:hover {
				background-color: #04395e;
				color: #ffffff;
			}

		.def-ln {
			padding-left: 0.5rem;
		}
	</style>
</head>

<body>
	<div id="scroll">
		<div id="totalHeightSpacer"></div>
		<div id="visible" class="ts-code" style="position: absolute; top: 0; left: 0; width: min-content; min-width: 100%;"></div>
	</div>
	<div id="searchContainer">
		<div id="searchButton">🔍</div>
		<div id="searchPanel">
			<input type="text" id="searchBox" placeholder="検索" autocomplete="off" spellcheck="false" list="searchHistory">
			<datalist id="searchHistory"></datalist>
			<div class="searchNav">
				<label id="searchRegexLabel"><input type="checkbox" id="searchRegex">正規表現</label>
				<label id="searchResultLabel"></label>
			</div>
			<div class="searchNav">
				<button id="prevBtn">↑</button>
				<button id="nextBtn">↓</button>
			</div>
			<div id="searchInfo"></div>
		</div>
	</div>
	<div id="settingContainer">
		<div id="settingButton">⚙️</div>
		<div id="settingPanel">
			<div class="searchNav">
				<label for="settingTabNum">タブの幅 (\t)</label>
				<input type="number" id="settingTabNum" min="1" max="8" value="4" autocomplete="off">
			</div>
		</div>
	</div>
	<div id="bookMarkContainer">
		<div id="bookMarkButton">🚀</div>
		<div id="bookMarkPanel">
			<div id="bookMarkHeader">
				BookMarks
			</div>
			<div id="bookMarkList"></div>
		</div>
	</div>











	/*insert by C#*/

	//
	// <script>
	//



		class FloatingPopup {
			constructor(container, button, panel) {
				this.container = container;
				this.button = button;
				this.panel = panel;

				this.isDragging = false;
				this.offset = { x: 0, y: 0 };
				this.startPos = { x: 0, y: 0 }; // クリック判定用

				this.initEvents();
			}

			initEvents() {
				// --- 1. ドラッグ開始 (pointerdown) ---
				this.container.addEventListener('pointerdown', (e) => {
					// パネル内部（入力欄など）を操作しているときはドラッグしない

					high = mid - 1; // もっと手前にあるか探す

				matchedIndices.push(i);

			while (low <= high) {
				const mid = (low + high) >> 1;
				// ★ 2個1組なので mid * 2 + 1 が EndByte
				const endByte = searchResults[mid * 2 + 1];

				if (endByte > lineStart) {

				const startByte = searchResults[i * 2];

			// エスケープされたHTML文字列（&lt;div&gt; など）をアンエスケープする
			function decodeHtml(html) {
				const txt = document.createElement("textarea");
				txt.innerHTML = html;
				return txt.value;
			}

			// 閉じタグが不要な要素（空要素）のリスト
			const VOID_ELEMENTS = new Set([
				'area', 'base', 'br', 'col', 'embed', 'hr', 'img', 'input',
				'link', 'meta', 'param', 'source', 'track', 'wbr'
			]);

			// N階層分の構造文字列（閉じタグ付き）を生成する関数
			function buildStructureText(targetNode, maxDepth) {
				// 右クリックされた場所から、ツリーの要素（<details> または .tree-item）を探す
				const rootEl = targetNode.closest('details, .tree-item');
				if (!rootEl) return '';

				const lines = [];

				// 再帰的にツリーを走査する内部関数
				function traverse(element, currentDepth) {
					if (currentDepth > maxDepth) return;

					const indent = '  '.repeat(currentDepth);

					// 1. 自身の span.name から title 属性（生のタグ文字列）を取得
					const nameSpan = element.querySelector(':scope > summary > .name, :scope > .name');
					let rawTag = '';
					let tagName = '';

					if (nameSpan && nameSpan.title) {
						rawTag = decodeHtml(nameSpan.title);

						// タグ名（例: <div id="scroll"> から "div"）を正規表現で抽出
						const match = rawTag.match(/^<([a-zA-Z0-9-]+)/);
						if (match) {
							tagName = match[1].toLowerCase();
						}
					}

					// 開始タグを出力
					if (rawTag) {
						lines.push(indent + rawTag);
					}

					// 2. 子要素（.tree-children）を巡回して再帰
					if (currentDepth < maxDepth) {
						const childrenContainer = element.querySelector(':scope > .tree-children');
						if (childrenContainer) {
							const childElements = childrenContainer.querySelectorAll(':scope > details, :scope > .tree-item');
							childElements.forEach(child => {
								traverse(child, currentDepth + 1);
							});
						}
					}

					// 3. 閉じタグを出力（空要素でなく、かつタグ名が取れている場合）
					if (tagName && !VOID_ELEMENTS.has(tagName)) {
						// Self-closingタグ（例: <div />）で終わっていない場合のみ閉じタグを追加
						if (!rawTag.endsWith('/>')) {
							lines.push(`${indent}</${tagName}>`);
						}
					}
				}

				// 起点要素から探索開始 (深さ0)
				traverse(rootEl, 0);

				return lines.join('\n');
			}

			// 実際のコピー処理
			function copyStructure(node, depth) {
				const textToCopy = buildStructureText(node, depth);

				if (textToCopy) {
					// クリップボードにコピー
					navigator.clipboard.writeText(textToCopy).then(() => {
						console.log("コピー成功！:\n" + textToCopy);
					});
				}
			}
		});

		function executeSearch(keyword, isRegex = false, isCaseInsensitive = true) {

			searchResults = [];
			currentSearchIndex = -1;
			searchResultLabel.textContent = "";

			if (!keyword) {
				triggerVisibleLinesRefresh();
				return;
			}
			try {
				const selectedOffset = lastSelection;
				let startIndex = -1;
				let pattern = isRegex ? keyword : escapeRegExp(keyword);
				let flags = "gs";
				if (isCaseInsensitive)
					flags += "i";

				const regex = new RegExp(pattern, flags);
				let match;

				// fileText はもう UTF16 string
				const targetStr = fileText;
				while ((match = regex.exec(targetStr)) !== null) {
					if (match[0].length === 0) {
						regex.lastIndex++;
						continue;
					}
					if (selectedOffset && startIndex === -1 && selectedOffset <= match.index) {
						startIndex = searchResults.length / 2;
					}
					// match.index はもう UTF16 offset
					const start = match.index;
					const end = start + match[0].length;
					searchResults.push(start, end);

				}
				console.log(`検索完了: ${searchResults.length / 2} 件ヒット`);
				if (searchResults.length > 0) {

					if (!selectedOffset || startIndex === -1) {
						currentSearchIndex = 0;
						jumpToHit(currentSearchIndex);
					} else {
						currentSearchIndex = startIndex;
						jumpToHit(currentSearchIndex);
					}
				} else {
					triggerVisibleLinesRefresh();
				}
			} catch (e) {
				console.error("検索エラー:", e);
			}
		}

			if (!keyword) {
				resultListEl.innerHTML = '';
				resultLabelEl.innerText = '--件';
				return;
			}

			let filtered = [];

			try {
				if (isRegex) {
					// ==========================================
					// 1. 正規表現検索の場合
					// ==========================================
					const flags = isCaseInsensitive ? 'i' : '';
					const regex = new RegExp(keyword, flags);

					filtered = dataList.filter(item => regex.test(item.nm));

					// 正規表現時は「先頭一致」の概念が複雑になるため、
					// 文字列の最初の方でマッチしているものを優先する簡易ソート
					filtered.sort((a, b) => {
						const matchA = a.nm.match(regex);
						const matchB = b.nm.match(regex);
						return (matchA ? matchA.index : 0) - (matchB ? matchB.index : 0);
					});
				} else {
					// ==========================================
					// 2. 通常の文字列検索（部分一致 ＋ 先頭優先ソート）
					// ==========================================
					const searchKey = isCaseInsensitive ? keyword.toLowerCase() : keyword;

					// まずは絞り込み
					filtered = dataList.filter(item => {
						const targetName = isCaseInsensitive ? item.nm.toLowerCase() : item.nm;
						return targetName.includes(searchKey);
					});

					// 先頭一致を最優先にするソートを適用
					filtered.sort((a, b) => {
						const nameA = isCaseInsensitive ? a.nm.toLowerCase() : a.nm;
						const nameB = isCaseInsensitive ? b.nm.toLowerCase() : b.nm;

						const indexA = nameA.indexOf(searchKey);
						const indexB = nameB.indexOf(searchKey);

						// 検索文字がより手前（先頭）にあるものを優先
						if (indexA !== indexB) {
							return indexA - indexB;
						}
						// 位置が同じなら、文字数が短い（完全一致に近い）方を優先
						//if (a.name.length !== b.name.length) {
						//	return a.name.length - b.name.length;
						//}
						// それでも同じならアルファベット順
						return a.nm.localeCompare(b.nm);
					});
				}
			} catch (e) {
				// 不完全な正規表現（例: 「[」だけ入力された等）の際のエラー落ちを防ぐガード
				resultLabelEl.innerText = 'エラー';
				resultListEl.innerHTML = `<div class="search-error">不正な検索式です</div>`;
				return;
			}

			// ==========================================
			// 3. 結果の描画（レンダリング）
			// ==========================================
			resultLabelEl.innerText = `${filtered.length}件`;
			resultListEl.innerHTML = ''; // 過去の結果をクリア

			if (filtered.length === 0) {
				resultListEl.innerHTML = `<div class="search-no-result">一致する定義は見つかりません</div>`;
				return;
			}

			// 検索結果をループしてHTML要素を組み立てる
			filtered.forEach(item => {
				const itemEl = document.createElement('div');
				itemEl.className = `symbol-item ${item.ct?.replace('.', '-')}`;

				// ユーザーがクリックした時にC#側にジャンプ要求を送るためのイベント
				itemEl.onclick = () => {
					searchRegex.checked = true;
					searchBox.value = `(?<![A-Za-z0-9_])${item.nm}(?![A-Za-z0-9_])`;
					executeSearch(searchBox.value, searchRegex.checked);
					lastSelection = item.sb;
					jumpToDefinition(item.fi, item.sb);
				};

				// 中身のテキストを構築（Declaration があれば右側に薄く添える）
				const nameSpan = document.createElement('span');
				nameSpan.className = 'name';
				nameSpan.innerText = item.nm;

				itemEl.appendChild(nameSpan);

				if (projectCurrentGuid && projectCurrentGuid !== item.fi) {
					const fileName = projectGuidFileDic[item.fi];
					if (fileName) {
						const fileNameSpan = document.createElement('span');
						fileNameSpan.className = 'file-name';
						fileNameSpan.textContent = `[${fileName}]`;
						fileNameSpan.title = fileName;
						itemEl.appendChild(fileNameSpan);
					}
				}

				if (item.dc) {
					const declSpan = document.createElement('span');
					declSpan.className = 'symbol-declaration';
					//const maxLength = 50;

					//declSpan.innerText =
					//	item.dc.length > maxLength
					//		? `  -  ${item.dc.substring(0, maxLength)}...`
					//		: `  -  ${item.dc}`;
					declSpan.innerText = `  -  ${item.dc}`;
					itemEl.appendChild(declSpan);
				}

				resultListEl.appendChild(itemEl);
			});
		}


		function searchDefRef(dataList, keyword, isRegex = false, isCaseInsensitive = true) {
			if (!keyword) {
				return [];
			}

			let filtered = [];

			try {
				if (isRegex) {
					const flags = isCaseInsensitive ? 'i' : '';
					const regex = new RegExp(keyword, flags);

					filtered = dataList.filter(item => regex.test(item.nm));

					// マッチ位置が早いものを優先
					filtered.sort((a, b) => {
						const matchA = a.nm.match(regex);
						const matchB = b.nm.match(regex);

						return (matchA ? matchA.index : 0) -
							(matchB ? matchB.index : 0);
					});
				} else {
					const searchKey = isCaseInsensitive
						? keyword.toLowerCase()
						: keyword;

					filtered = dataList.filter(item => {
						const targetName = isCaseInsensitive
							? item.nm.toLowerCase()
							: item.nm;

						return targetName.includes(searchKey);
					});

					filtered.sort((a, b) => {
						const nameA = isCaseInsensitive
							? a.nm.toLowerCase()
							: a.nm;

						const nameB = isCaseInsensitive
							? b.nm.toLowerCase()
							: b.nm;

						const indexA = nameA.indexOf(searchKey);
						const indexB = nameB.indexOf(searchKey);

						if (indexA !== indexB) {
							return indexA - indexB;
						}

						return a.nm.localeCompare(b.nm);
					});
				}
			} catch (e) {
				// 不正な正規表現
				return null;
			}

			return filtered;
		}
		function showDefRefSearchResult(
			filtered,
			eleListName,
			eleLabelName
		) {
			const resultListEl = document.getElementById(eleListName);
			const resultLabelEl = document.getElementById(eleLabelName);

			resultListEl.innerHTML = '';

			if (filtered === null) {
				resultLabelEl.innerText = 'エラー';
				resultListEl.innerHTML =
					`<div class="search-error">不正な検索式です</div>`;
				return;
			}

			resultLabelEl.innerText = `${filtered.length}件`;

			if (filtered.length === 0) {
				resultListEl.innerHTML =
					`<div class="search-no-result">一致する定義は見つかりません</div>`;
				return;
			}

			filtered.forEach(item => {
				const itemEl = document.createElement('div');
				itemEl.className =
					`symbol-item ${item.ct?.replace('.', '-')}`;

				itemEl.onclick = () => {
					searchRegex.checked = true;
					searchBox.value =
						`(?<![A-Za-z0-9_])${item.nm}(?![A-Za-z0-9_])`;

					executeSearch(
						searchBox.value,
						searchRegex.checked
					);

					lastSelection = item.sb;
					jumpToDefinition(item.fi, item.sb);
				};

				const nameSpan = document.createElement('span');
				nameSpan.className = 'name';
				nameSpan.innerText = item.nm;

				itemEl.appendChild(nameSpan);

				if (projectCurrentGuid && projectCurrentGuid !== item.fi) {
					const fileName = projectGuidFileDic[item.fi];

					if (fileName) {
						const fileNameSpan = document.createElement('span');
						fileNameSpan.className = 'file-name';
						fileNameSpan.textContent = `[${fileName}]`;
						fileNameSpan.title = fileName;

						itemEl.appendChild(fileNameSpan);
					}
				}

				if (item.dc) {
					const declSpan = document.createElement('span');
					declSpan.className = 'symbol-declaration';
					declSpan.innerText = `  -  ${item.dc}`;

					itemEl.appendChild(declSpan);
				}

				resultListEl.appendChild(itemEl);
			});
		}

		window.chrome.webview?.addEventListener("message", e => {
			const msg = e.data;

			if (msg.type === "definitionResult") {
				const config = defRefSearchConfig['definition'];

				const results = msg.results;
				console.log(`def: results.length = ${results.length} && defcnt = ${msg.defcount} && filecnt = ${msg.filecount} && loadcnt = ${msg.loadcount}`);
				if (results.length > 0 && results[0].nm === msg.word &&
					(results.length === 1 || results[1].nm !== msg.word)) {
					// 1件だけヒットした場合には該当箇所にジャンプする 
					console.log(`def: go jump`);
					jumpToDefinition(results[0].fi, results[0].sb);
				}

				showDefRefSearchResult(msg.results, config.listId, config.labelId);
				document.getElementById(config.spinId).classList.remove('search-spinner');
			} else if (msg.type == "referenceResult") {
				const config = defRefSearchConfig['reference'];
				showDefRefSearchResult(msg.results, config.listId, config.labelId);
				document.getElementById(config.spinId).classList.remove('search-spinner');
			}
		});
		function isWebView2() {
			if (window.chrome?.webview?.postMessage) {
				return true;
			} else {
				return false;
			}
		}

		function sendToHost(message) {
			if (window.chrome?.webview?.postMessage) {
				window.chrome.webview.postMessage(message);
				return true;
			}
			return false;
		}

		let defFlashTimer = null;

		function jumpToDefinition(fileId, startByte, orgLineNumber = -1) {
			if (fileId && fileId != projectCurrentGuid) {
				// 別ファイルへ
				if (sendToHost({
					cmd: "jump",
					fileId: fileId,
					startByte: startByte,
					orgLineNumber: orgLineNumber
				})) {
					return;
				}

			}

			if (defFlashTimer !== null) {
				clearTimeout(defFlashTimer);
			}

			locationHistory.push({ scrollTop: scrollEl.scrollTop, lineNumber: orgLineNumber });

			const start = parseInt(startByte, 10);
			defineLine = getLineNumber(start);
			console.log(`taget line = ${defineLine}`);
			jumpToStartByte(start);

			defFlashTimer = setTimeout(() => {
				defineLine = -1;
				render();
				defFlashTimer = null;

			}, 700);
		}

		function getLineNumber(startByte) {
			let low = 0;
			let high = lineStartOffsets.length - 1;
			let targetLineIdx = 0;

			while (low <= high) {
				const mid = (low + high) >> 1;
				if (lineStartOffsets[mid] <= startByte) {
					targetLineIdx = mid;
					low = mid + 1; // もっと後ろの行の可能性を探る
				} else {
					high = mid - 1;
				}
			}
			return targetLineIdx;
		}

		function jumpToStartByte(startByte) {
			// console.log(`jumpToStartByte: ${startByte}`);
			let targetLineIdx = getLineNumber(startByte);
			scrollToLine(targetLineIdx - 10);
			triggerVisibleLinesRefresh();
		}


		// 指定したヒットインデックス（0番目、1番目...）へスクロール＆フォーカスする内部関数
		function jumpToHit(index) {
			if (searchResults.length === 0 || index < 0 || index >= searchResults.length / 2) return;

			searchResultLabel.textContent = `${index + 1} / ${searchResults.length / 2}`;

			currentSearchIndex = index;
			const startByte = searchResults[index * 2];

			jumpToStartByte(startByte);
		}

		// 【次へ】ボタン用
		function nextHit() {
			if (searchResults.length === 0) return;
			let nextIdx = currentSearchIndex + 1;
			if (nextIdx >= searchResults.length / 2) {
				nextIdx = 0; // 末尾まで行ったら最初に戻る（ループ）
			}
			jumpToHit(nextIdx);
		}

		// 【前へ】ボタン用
		function prevHit() {
			if (searchResults.length === 0) return;
			let prevIdx = currentSearchIndex - 1;
			if (prevIdx < 0) {
				prevIdx = (searchResults.length / 2) - 1; // 最初より前に行ったら末尾に飛ぶ
			}
			jumpToHit(prevIdx);
		}

		function updateHistoryDOM(dataListDom, historyList) {
			// 一度中身を空にする
			dataListDom.innerHTML = "";

			// 配列内のワードを option タグにして追加
			historyList.forEach(word => {
				const option = document.createElement("option");
				option.value = word;
				dataListDom.appendChild(option);
			});
		}

		// 3. 新しい検索ワードを履歴に追加する関数
		function saveToHistory(word, dataListDom, historyList) {
			if (!word || word.trim() === "") return;

			// 同じワードを削除
			const index = historyList.indexOf(word);
			if (index !== -1) {
				historyList.splice(index, 1);
			}

			// 先頭に追加
			historyList.unshift(word);

			// 10件に制限
			if (historyList.length > 10) {
				historyList.length = 10;
			}

			updateHistoryDOM(dataListDom, historyList);
		}



	</script>

			<div class="definition-tabs">

				</div>
